server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gene filters travel in the query string of a GET, and the default 8k
    # request-line buffer is not enough: 479 of 480 genes measured 7,780 bytes,
    # and 600 genes returned 414. The client now sends whichever of the
    # allowlist / its complement is shorter, which bounds a request at about
    # half the panel — 64k covers that for a 5,000-gene Xenium Prime run.
    # Buffers are allocated only when a request actually needs them.
    large_client_header_buffers 4 64k;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;

        # Large in-memory buffers so big boundary/transcript responses
        # never spill to disk (eliminates the "buffered to a temporary file" warnings).
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          16 1m;
        proxy_busy_buffers_size 2m;
    }

    # Hashed static assets — serve directly; never fall back to index.html.
    # Vite fingerprints every file in /assets/ so a 404 here means the Docker
    # image is stale (use --no-cache to force a clean rebuild).
    #
    # The filename changes whenever the contents do, so these can be cached hard
    # and forever. That is the half of the contract that makes the no-cache on
    # index.html below cheap: only the tiny HTML is ever re-fetched.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must be revalidated on every load, and this is load-bearing.
    #
    # It is the only file that names the current bundle. Without an explicit
    # Cache-Control, nginx sends just Last-Modified/ETag and browsers fall back
    # to *heuristic* caching — they may serve a stale index.html for hours
    # without asking. After a rebuild that means the tab keeps running the
    # previous bundle: the app looks fine, reports the new version string from
    # the backend, and silently lacks every frontend fix in the update. That is
    # exactly what "I rebuilt and my change isn't there" looks like, and it cost
    # a debugging session to track down.
    #
    # `no-cache` does not mean "do not store" — it means "revalidate before
    # using", so the usual response is a 304 and the cost is one round trip.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
